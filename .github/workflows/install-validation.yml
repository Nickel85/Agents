name: Install Validation

on:
  push:
  pull_request:

jobs:
  validate-install:
    name: Validate no-admin agent install
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate installer and agent manifests
        shell: pwsh
        run: ./tests/install-validation.ps1

      - name: Validate mongoose CLI
        shell: pwsh
        run: ./tests/mongoose-validation.ps1

      - name: Validate mongoose local state
        shell: pwsh
        run: python ./tests/mongoose-state-validation.py

      - name: Validate mongoose memory provider
        shell: pwsh
        run: python ./tests/mongoose-memory-validation.py

      - name: Validate mongoose runtime observability
        shell: pwsh
        run: python ./tests/mongoose-runtime-observability-validation.py

      - name: Validate mongoose LLM cold-start behavior
        shell: pwsh
        run: python ./tests/mongoose-llm-cold-start-validation.py

      - name: Validate loop-aware memory contract
        shell: pwsh
        run: python ./tests/loop-aware-memory-contract-validation.py

      - name: Validate decision/rule/experiment memory contract
        shell: pwsh
        run: python ./tests/decision-rule-experiment-contract-validation.py

      - name: Validate Njord finance memory records
        shell: pwsh
        run: python ./tests/njord-finance-memory-validation.py

      - name: Validate Portfolio thesis memory records
        shell: pwsh
        run: python ./tests/portfolio-thesis-validation.py

      - name: Validate release version metadata
        shell: pwsh
        run: python ./tests/release-version-validation.py

      - name: Validate terminal output formatting
        shell: pwsh
        run: python ./tests/terminal-output-validation.py

      - name: Validate YNAB read API foundation
        shell: pwsh
        run: python ./tests/ynab-api-validation.py

      - name: Validate YNAB config handling
        shell: pwsh
        run: python ./tests/njord-config-validation.py

      - name: Validate Njord snapshot model
        shell: pwsh
        run: python ./tests/njord-snapshot-validation.py

      - name: Validate Njord LLM runtime
        shell: pwsh
        run: python ./tests/njord-llm-runtime-validation.py

      - name: Validate Njord REPL
        shell: pwsh
        run: python ./tests/njord-repl-validation.py
